name: Update Air Quality

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-air-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch both IQAir stations
        shell: bash
        run: |
          set -euo pipefail

          fetch_aqi () {
            local url="$1"
            local outfile="$2"

            curl -L --fail --retry 3 --connect-timeout 20 --max-time 60               -A "Mozilla/5.0"               -H "Accept: application/json"               "$url" -o "$outfile"

            jq empty "$outfile"

            jq -r '
              [
                .current.aqius,
                .current.pollution.aqius,
                .data.current.aqius,
                .data.current.pollution.aqius,
                .aqius,
                .aqi
              ]
              | map(select(. != null))
              | .[0] // empty
            ' "$outfile"
          }

          AL_THUMAMA=$(fetch_aqi "https://device.iqair.com/v2/6a0ea9f1c5a918895e1e73a5" "al-thumama.json")
          MESAIMEER=$(fetch_aqi "https://device.iqair.com/v2/695cd2716a2f38ed6082fcd4" "mesaimeer.json")

          for value in "$AL_THUMAMA" "$MESAIMEER"; do
            if [[ -z "$value" || ! "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "A station returned an invalid AQI value."
              exit 1
            fi
          done

          AL_THUMAMA=$(printf "%.0f" "$AL_THUMAMA")
          MESAIMEER=$(printf "%.0f" "$MESAIMEER")
          UPDATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n             --argjson al_thumama "$AL_THUMAMA"             --argjson mesaimeer "$MESAIMEER"             --arg updated "$UPDATED"             '{
              stations: {
                al_thumama: {aqi: $al_thumama},
                mesaimeer: {aqi: $mesaimeer}
              },
              updated: $updated
            }' > data.json

          echo "Al Thumama AQI: $AL_THUMAMA"
          echo "Mesaimeer AQI: $MESAIMEER"

      - name: Commit updated AQI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AQI Updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi

          git commit -m "Update live campus AQI readings"
          git push
