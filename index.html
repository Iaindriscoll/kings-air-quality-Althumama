<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: Arial, sans-serif;
    }

    .aqi-widget {
        box-sizing: border-box;
        width: 100%;
        min-height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 12px;
    }

    .main {
        font-size: 22px;
        font-weight: 600;
    }

    #aqi {
        font-weight: 700;
    }

    #status {
        font-weight: 700;
    }

    .updated {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.65;
    }
</style>
</head>

<body>

<div class="aqi-widget">

    <div>

        <div class="main">
            Current Air Quality:
            <span id="aqi">Loading...</span>
            <span id="separator"></span>
            <span id="status"></span>
        </div>

        <div class="updated" id="updated">
            King's College Doha
        </div>

    </div>

</div>

<script>

function getStatus(aqi) {

    if (aqi <= 50) {
        return "Good";
    }

    if (aqi <= 100) {
        return "Moderate";
    }

    if (aqi <= 150) {
        return "Unhealthy for Sensitive Groups";
    }

    if (aqi <= 200) {
        return "Unhealthy";
    }

    if (aqi <= 300) {
        return "Very Unhealthy";
    }

    return "Hazardous";
}


async function loadAQI() {

    try {

        /*
        Timestamp prevents browsers from displaying
        an old cached copy of data.json
        */

        const response = await fetch(
            "data.json?t=" + new Date().getTime()
        );

        if (!response.ok) {
            throw new Error("Could not load AQI data");
        }

        const data = await response.json();

        const aqi = Number(data.aqi);

        if (!Number.isFinite(aqi)) {
            throw new Error("Invalid AQI");
        }

        document.getElementById("aqi").textContent = aqi;

        document.getElementById("separator").textContent = " – ";

        document.getElementById("status").textContent =
            getStatus(aqi);


        if (data.updated) {

            const updated = new Date(data.updated);

            document.getElementById("updated").textContent =
                "King's College Doha • Updated " +
                updated.toLocaleTimeString(
                    "en-GB",
                    {
                        timeZone: "Asia/Qatar",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById("aqi").textContent =
            "Temporarily unavailable";

        document.getElementById("separator").textContent = "";

        document.getElementById("status").textContent = "";

    }

}


loadAQI();

/*
Refresh the displayed data every 5 minutes.
This doesn't contact IQAir.
It simply checks our own data.json file.
*/

setInterval(loadAQI, 300000);

</script>

</body>
</html>
