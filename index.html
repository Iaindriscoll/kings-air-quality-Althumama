<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>King's College Doha Air Quality</title>
<style>
:root{--red:#cf033c;--gold:#c2a572;--ink:#222}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:auto;overflow:hidden;background:transparent;font-family:"Open Sans","Trebuchet MS",Arial,sans-serif;color:var(--ink)}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:0}
.bar{width:100%;height:68px;min-height:68px;display:grid;grid-template-columns:125px 1fr 1fr 120px;align-items:stretch;background:#fff;border:1px solid var(--gold);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.brand{background:var(--red);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:6px 14px}
.brand-title{font-size:15px;font-weight:800;letter-spacing:.15em}.brand-line{height:1px;background:rgba(255,255,255,.65);margin:8px 0}.brand-school{font-size:10px;font-weight:700;letter-spacing:.17em}
.station{display:flex;align-items:center;gap:10px;padding:6px 12px;border-right:1px solid rgba(194,165,114,.65)}
.dot{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#ddd;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.campus{font-size:15px;font-weight:800;margin-bottom:5px;white-space:nowrap}.reading{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.aqi{font-size:25px;font-weight:800;line-height:1}.sep{color:#aaa}.status{font-size:14px;font-weight:800}
.time{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 10px}.clock{font-size:28px;color:#666}.time-label{font-size:12px;color:#666}.time-value{font-size:14px;font-weight:700;margin-top:3px;white-space:nowrap}
@media(max-width:720px){.bar{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1;min-height:70px}.station{border-top:1px solid #eee}.station:nth-of-type(3){border-right:0}.time{grid-column:1/-1;border-top:1px solid #eee;min-height:55px}.brand-title{font-size:15px}.brand-school{font-size:9px}}
@media(max-width:450px){.station{padding:10px;gap:8px}.dot{width:42px;height:42px;flex-basis:42px}.campus{font-size:13px}.aqi{font-size:23px}.status{font-size:13px}}
</style>
</head><body>
<div class="wrap"><div class="bar">
<div class="brand"><div class="brand-title">AIR QUALITY</div><div class="brand-line"></div><div class="brand-school">KING'S COLLEGE DOHA</div></div>
<div class="station"><div class="dot" id="al-dot"></div><div><div class="campus">Al Thumama</div><div class="reading"><span class="aqi" id="al-aqi">--</span><span class="sep">|</span><span class="status" id="al-status">Loading…</span></div></div></div>
<div class="station"><div class="dot" id="me-dot"></div><div><div class="campus">Mesaimeer</div><div class="reading"><span class="aqi" id="me-aqi">--</span><span class="sep">|</span><span class="status" id="me-status">Loading…</span></div></div></div>
<div class="time"><div class="clock">◷</div><div><div class="time-label">Updated</div><div class="time-value" id="updated">Checking…</div></div></div>
</div></div>
<script>
function category(a){if(a<=50)return["Good","#00E400"];if(a<=100)return["Moderate","#FFFF00"];if(a<=150)return["Unhealthy for Sensitive Groups","#FF7E00"];if(a<=200)return["Unhealthy","#FF0000"];if(a<=300)return["Very Unhealthy","#8F3F97"];return["Hazardous","#7E0023"]}
function show(p,a){a=Number(a);if(!Number.isFinite(a))throw Error("Invalid AQI");const c=category(a);document.getElementById(p+"-aqi").textContent=Math.round(a);document.getElementById(p+"-status").textContent=c[0];document.getElementById(p+"-status").style.color=c[1]==="#FFFF00"?"#a88400":c[1];document.getElementById(p+"-dot").style.background=c[1]}
async function load(){try{const r=await fetch("./data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();const d=await r.json();show("al",d.stations.al_thumama.aqi);show("me",d.stations.mesaimeer.aqi);if(d.updated){const t=new Date(d.updated).toLocaleTimeString("en-GB",{timeZone:"Asia/Qatar",hour:"2-digit",minute:"2-digit"});document.getElementById("updated").textContent=t+" Doha time"}}catch(e){document.getElementById("updated").textContent="Temporarily unavailable"}}
load();setInterval(load,300000);
</script></body></html>
